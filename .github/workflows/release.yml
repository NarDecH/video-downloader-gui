name: Release (build EXE)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --clean --noconfirm VideoDownloaderGUI.spec

      - name: Generate checksums
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/VideoDownloaderGUI.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VideoDownloaderGUI.exe" | Out-File -Encoding ascii dist/checksums.txt
          Get-Content dist/checksums.txt
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Rename exe with version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item dist/VideoDownloaderGUI.exe "dist/VideoDownloaderGUI-$tag.exe"

      - name: Attest build artifacts (provenance)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/VideoDownloaderGUI-*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VideoDownloaderGUI-*.exe
            dist/checksums.txt
          generate_release_notes: true
          body: |
            ## ดาวน์โหลด
            - **VideoDownloaderGUI-${{ github.ref_name }}.exe** — ไฟล์เดียวจบ ไม่ต้องติดตั้ง Python (รวม ffmpeg แล้ว)

            ## ตรวจสอบไฟล์ (SHA256)

            ```
            ${{ steps.hash.outputs.sha256 }}  VideoDownloaderGUI-${{ github.ref_name }}.exe
            ```

            ตรวจเองได้ด้วย:
            ```powershell
            Get-FileHash .\VideoDownloaderGUI-${{ github.ref_name }}.exe -Algorithm SHA256
            ```

            > 💡 ถ้า SmartScreen เตือน กด **More info → Run anyway**
            > 📄 เอกสารทั้งหมด: https://nardech.github.io/video-downloader-gui/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write latest.json for Pages (EXE section)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $sha = (Get-Content dist/checksums.txt).Split(' ')[0]
          $file = "docs/data/latest.json"
          $data = if (Test-Path $file) { Get-Content $file -Encoding utf8 | ConvertFrom-Json } else { $null }
          if (-not $data) {
            $data = [PSCustomObject]@{ tag = $tag; published_at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ"); exe = $null; apk = $null }
          }
          $data.tag = $tag
          $data.published_at = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $exe = [PSCustomObject]@{
            name = "VideoDownloaderGUI-$tag.exe"
            url = "https://github.com/NarDecH/video-downloader-gui/releases/download/$tag/VideoDownloaderGUI-$tag.exe"
            sha256 = $sha
            size = (Get-Item "dist/VideoDownloaderGUI-$tag.exe").Length
            downloads = 0
          }
          $obj = $data | ConvertTo-Json -Depth 5 | ConvertFrom-Json
          if ($obj.PSObject.Properties["exe"]) { $obj.exe = $exe } else { $obj | Add-Member -NotePropertyName exe -NotePropertyValue $exe }
          New-Item -ItemType Directory -Force -Path docs/data | Out-Null
          $obj | ConvertTo-Json -Depth 5 | Out-File $file -Encoding utf8
          Get-Content $file

      - name: Commit latest.json back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          if (git diff --cached --quiet) { echo "no changes"; exit 0 }
          git commit -m "chore: update latest.json (exe) for ${{ github.ref_name }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

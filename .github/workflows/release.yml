name: Release (build EXE)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: python -m PyInstaller --clean --noconfirm VideoDownloaderGUI.spec

      - name: Generate checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/VideoDownloaderGUI.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  VideoDownloaderGUI.exe" | Out-File -Encoding ascii dist/checksums.txt
          Get-Content dist/checksums.txt

      - name: Rename exe with version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item dist/VideoDownloaderGUI.exe "dist/VideoDownloaderGUI-$tag.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VideoDownloaderGUI-*.exe
            dist/checksums.txt
          generate_release_notes: true
          body: |
            ## ดาวน์โหลด
            - **VideoDownloaderGUI-${{ github.ref_name }}.exe** — ไฟล์เดียวจบ ไม่ต้องติดตั้ง Python (รวม ffmpeg แล้ว)

            ## ตรวจสอบไฟล์ (SHA256)
            ค่า checksum อยู่ในไฟล์ `checksums.txt` หรือตรวจเองด้วย:
            ```powershell
            Get-FileHash .\VideoDownloaderGUI-${{ github.ref_name }}.exe -Algorithm SHA256
            ```

            > 💡 ถ้า SmartScreen เตือน กด **More info → Run anyway**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

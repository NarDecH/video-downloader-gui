name: Release (Android APK)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Decode signing keystore
        run: echo -n "$ANDROID_KEYSTORE_B64" | base64 -d > /tmp/release.jks
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare artifacts
        run: |
          TAG="${{ github.ref_name }}"
          cp android/app/build/outputs/apk/release/app-release.apk "VideoDownloaderGUI-android-$TAG.apk"
          sha256sum "VideoDownloaderGUI-android-$TAG.apk" > android-checksums.txt
          cat android-checksums.txt

      - name: Attest build artifacts (provenance)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            VideoDownloaderGUI-android-*.apk

      - name: Upload to GitHub Release
        id: rel
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VideoDownloaderGUI-android-*.apk
            android-checksums.txt
          generate_release_notes: true
          append_body: true
          body: |
            ## Android (SHA256)

            ```
            $(cat android-checksums.txt | sed "s|VideoDownloaderGUI-android-v\([0-9.]*\)\.apk|VideoDownloaderGUI-android-${{ github.ref_name }}.apk|")
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write latest.json for Pages (same-origin, no API rate limit)
        run: |
          TAG="${{ github.ref_name }}"
          APK_SHA=$(cut -d' ' -f1 android-checksums.txt)
          mkdir -p docs/data
          python3 - <<PYEOF
          import json, os, pathlib
          tag = "$TAG"
          apk_sha = "$APK_SHA"
          path = pathlib.Path("docs/data/latest.json")
          data = {}
          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
          data["tag"] = tag
          data["published_at"] = "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          data["apk"] = {"name": f"VideoDownloaderGUI-android-{tag}.apk",
                         "url": f"https://github.com/NarDecH/video-downloader-gui/releases/download/{tag}/VideoDownloaderGUI-android-{tag}.apk",
                         "sha256": apk_sha}
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PYEOF

      - name: Commit latest.json back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            # commit จาก branch ที่ตั้งบน origin/main ล่าสุดเสมอ — ไม่แย่ง race กับ workflow ฝั่ง EXE
            # (reset --hard ไม่ลบ untracked ไฟล์ artifact เช่น apk/checksums)
            git switch -C json-back origin/main
            git reset --hard origin/main
            TAG="${{ github.ref_name }}"
            APK_SHA=$(cut -d' ' -f1 android-checksums.txt)
            mkdir -p docs/data
            python3 - <<PYEOF
            import json, pathlib
            tag = "$TAG"
            apk_sha = "$APK_SHA"
            path = pathlib.Path("docs/data/latest.json")
            data = {}
            if path.exists():
                data = json.loads(path.read_text(encoding="utf-8"))
            data["tag"] = tag
            data["published_at"] = "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            data["apk"] = {"name": f"VideoDownloaderGUI-android-{tag}.apk",
                           "url": f"https://github.com/NarDecH/video-downloader-gui/releases/download/{tag}/VideoDownloaderGUI-android-{tag}.apk",
                           "sha256": apk_sha}
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
            PYEOF
            git add docs/data/latest.json
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -m "chore: update latest.json (apk) for ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main && exit 0
            echo "push rejected — another workflow moved main, retrying"
            sleep 15
          done
          echo "failed to push latest.json after 3 attempts"; exit 1

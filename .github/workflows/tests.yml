name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --quiet yt-dlp pillow imageio-ffmpeg ruff

      - name: Ruff lint (html_media, tests, assets)
        run: |
          ruff check html_media.py tests/ assets/make_docs_images.py --select E9,F63,F7,F82 --ignore F401

      - name: Compile check
        run: python -m py_compile main.py html_media.py

      - name: Run fallback test suite (with xvfb for GUI smoke)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python tests/run_tests.py
